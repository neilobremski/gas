name: ci

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited]
  push:
    branches: [main]

jobs:
  pii-text-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    steps:
      - uses: actions/checkout@v4
      - name: Check PR/issue title and description for PII
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
          TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          BODY: ${{ github.event.pull_request.body || github.event.issue.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | python3 .github/pii_check.py --stdin

  pii-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for PII in diff
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: python3 .github/pii_check.py

  version-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require version bumps for bridge/ and a8s/ changes
        run: >
          python3 .github/version_check.py
          --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

  a8s:
    runs-on: ubuntu-latest
    if: github.event_name != 'issues'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run a8s tests
        working-directory: a8s
        run: |
          npm ci
          npm run vendor
          tests/run
      - name: PII check unit tests
        run: python3 tests/test_pii.py
      - name: Version bump unit tests
        run: python3 tests/test_version.py
